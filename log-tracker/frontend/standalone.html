<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Amrita Log Tracker</title>
<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root{
  --bg:#0a0e14;
  --bg-1:#0d131c;
  --bg-2:#111925;
  --surface:#141d2b;
  --surface-2:#1b2739;
  --line:#212f44;
  --line-soft:#19243550;
  --fg:#dbe4f0;
  --fg-dim:#8493a8;
  --fg-faint:#54637a;
  --accent:#4d8dff;
  --accent-weak:#18345f;
  --ok:#33d17a;
  --warn:#e6b450;
  --err:#ff5d55;
  --info:#5aa2ff;
  --r:12px;
  --r-sm:8px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Cascadia Code','Consolas',ui-monospace,monospace;
  --shadow:0 10px 40px -12px rgba(0,0,0,.6);
}
html[data-theme="light"]{
  --bg:#eef1f7;
  --bg-1:#e9edf4;
  --bg-2:#ffffff;
  --surface:#ffffff;
  --surface-2:#f3f6fb;
  --line:#dde3ee;
  --line-soft:#e7ecf4;
  --fg:#18202e;
  --fg-dim:#586475;
  --fg-faint:#8a95a6;
  --accent:#2f6fe0;
  --accent-weak:#d9e6ff;
  --ok:#12915a;
  --warn:#b07a1e;
  --err:#d33a31;
  --info:#2f6fe0;
  --shadow:0 12px 32px -14px rgba(20,32,54,.22);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-size:13px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--fg-faint);}
[hidden]{display:none!important;}

/* =====================================================================
   PRIMITIVES
   ===================================================================== */
.inp,.sel{
  background:var(--surface);border:1px solid var(--line);color:var(--fg);
  height:36px;padding:0 12px;border-radius:var(--r-sm);font-size:12.5px;
  outline:none;transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
.sel{
  min-width:172px;cursor:pointer;padding-right:30px;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238493a8' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
.inp:focus,.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);}
.sel:disabled{opacity:.4;cursor:not-allowed;}
input[type=time],input[type=date]{color-scheme:dark;}
html[data-theme="light"] input[type=time],html[data-theme="light"] input[type=date]{color-scheme:light;}

.btn{
  height:36px;padding:0 15px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);color:var(--fg);font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:background .16s var(--ease),border-color .16s var(--ease),transform .12s var(--ease);
}
.btn:hover{background:var(--surface-2);border-color:var(--fg-faint);}
.btn:active{transform:translateY(1px);}
.btn.-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.-primary:hover{filter:brightness(1.08);background:var(--accent);}
.btn.-go{color:var(--ok);border-color:rgba(51,209,122,.55);background:rgba(51,209,122,.12);}
.btn.-stop{color:var(--err);border-color:rgba(255,93,85,.55);background:rgba(255,93,85,.10);}
.btn.-ghost{background:transparent;border-color:transparent;color:var(--fg-dim);}
.btn.-ghost:hover{background:var(--surface);color:var(--fg);}
.btn.-on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.-sm{height:30px;padding:0 11px;font-size:11.5px;}

.field{display:flex;flex-direction:column;gap:7px;}
.field > .lbl{
  font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--fg-faint);display:flex;align-items:center;gap:6px;
}
.field .lbl .k{
  width:15px;height:15px;border-radius:5px;background:var(--surface-2);color:var(--fg-faint);
  display:inline-flex;align-items:center;justify-content:center;font-size:9px;
}

/* segmented control with sliding pill */
.seg{position:relative;display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px;gap:2px;}
.seg .pill{position:absolute;top:3px;left:3px;height:calc(100% - 6px);border-radius:6px;
  background:var(--accent);z-index:0;opacity:0;transition:opacity .2s var(--ease);}
.seg button{position:relative;z-index:1;height:28px;padding:0 15px;border-radius:6px;
  font-size:12px;font-weight:600;color:var(--fg-dim);transition:color .18s var(--ease);}
.seg button:hover:not(:disabled){color:var(--fg);}
.seg button[aria-selected="true"]{color:#fff;}
.seg button:disabled{opacity:.35;cursor:not-allowed;}
.seg .empty{padding:0 12px;height:28px;display:flex;align-items:center;color:var(--fg-faint);font-size:12px;}

/* =====================================================================
   LAYOUT
   ===================================================================== */
lt-app{display:flex;flex-direction:column;height:100%;}

/* header */
lt-header{display:flex;align-items:center;justify-content:space-between;
  padding:12px 22px;background:var(--bg-1);border-bottom:1px solid var(--line);flex-shrink:0;}
.brand{display:flex;align-items:center;gap:13px;}
.brand .mark{width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(140deg,var(--accent),#8fb8ff);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:800;
  box-shadow:0 4px 14px -4px var(--accent);}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.2px;}
.brand .sub{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--fg-faint);margin-top:2px;}
.hgroup{display:flex;align-items:center;gap:14px;}
.clock{font-family:var(--mono);font-size:13px;color:var(--fg-dim);letter-spacing:.6px;min-width:78px;text-align:right;}
.conn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--fg-dim);}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--fg-faint);flex-shrink:0;transition:background .2s;}
.conn[data-s="online"] .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(51,209,122,.22);}
.conn[data-s="connecting"] .dot{background:var(--warn);animation:blink 1.3s infinite;}
.conn[data-s="offline"] .dot{background:var(--err);box-shadow:0 0 0 4px rgba(255,93,85,.22);}
@keyframes blink{50%{opacity:.35;}}
.icon-btn{width:34px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .16s var(--ease);}
.icon-btn:hover{background:var(--surface-2);}

/* panels */
.panel{display:flex;align-items:flex-end;gap:18px;padding:16px 22px;flex-wrap:wrap;flex-shrink:0;
  background:var(--bg-1);border-bottom:1px solid var(--line-soft);}
lt-timerange{overflow:hidden;display:block;flex-shrink:0;}
lt-timerange .panel{background:var(--surface);border-bottom:1px solid var(--line);}
.grow{flex:1;min-width:230px;}
.divider{width:1px;align-self:stretch;background:var(--line);margin:2px 0;}

/* toolbar */
lt-toolbar .bar{display:flex;align-items:center;gap:11px;padding:11px 22px;flex-wrap:wrap;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--line);}
.search{position:relative;}
.search .inp{padding-left:33px;width:240px;}
.search::before{content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:13px;height:13px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%238493a8' stroke-width='2.4'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>") no-repeat center;}
.stats{display:flex;align-items:center;gap:15px;padding-left:13px;border-left:1px solid var(--line);flex-wrap:wrap;}
.stat{font-size:11px;color:var(--fg-dim);display:inline-flex;gap:6px;align-items:baseline;}
.stat b{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--fg);}
.stat.-clk{cursor:pointer;}
.stat.-clk:hover{color:var(--fg);}
.stat.-err b{color:var(--err);}.stat.-warn b{color:var(--warn);}
.stat.-info b{color:var(--info);}.stat.-debug b{color:var(--fg-faint);}
.stat.-show b{color:var(--accent);}
.spacer{flex:1 1 20px;}
.menu{position:relative;}
.menu .list{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:190px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);
  overflow:hidden;transform-origin:top right;}
.menu .list button{display:flex;width:100%;padding:10px 14px;font-size:12px;text-align:left;gap:9px;align-items:center;}
.menu .list button:hover{background:var(--surface-2);}
.menu .list .sub{color:var(--fg-faint);font-size:10.5px;}

/* mode strip */
lt-strip .strip{padding:7px 22px;font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;flex-shrink:0;
  transition:background .3s var(--ease),color .3s var(--ease);}
lt-strip .strip[data-m="live"]{background:rgba(51,209,122,.09);color:var(--ok);
  border-bottom:1px solid rgba(51,209,122,.18);}
lt-strip .strip[data-m="history"]{background:rgba(77,141,255,.09);color:var(--accent);
  border-bottom:1px solid rgba(77,141,255,.18);}
lt-strip .d{width:7px;height:7px;border-radius:50%;background:currentColor;}
lt-strip .strip[data-m="live"] .d{animation:blink 1.6s infinite;}

/* viewer */
lt-viewer{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);}
.scroll{flex:1;overflow-y:auto;position:relative;}
.list{padding:6px 0 44px;font-family:var(--mono);font-size:12px;}
.row{display:flex;align-items:flex-start;gap:11px;padding:3px 22px;border-left:2px solid transparent;line-height:1.62;}
.row:hover{background:var(--surface);}
.row[data-l="ERROR"]{border-left-color:var(--err);background:rgba(255,93,85,.06);}
.row[data-l="WARN"]{border-left-color:var(--warn);}
.row .t{color:var(--fg-faint);flex-shrink:0;min-width:64px;font-size:11px;padding-top:1px;}
.row .bdg{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:.6px;padding:2px 6px;border-radius:4px;
  min-width:50px;text-align:center;margin-top:1px;}
.bdg[data-l="ERROR"]{background:rgba(255,93,85,.18);color:var(--err);}
.bdg[data-l="WARN"]{background:rgba(230,180,80,.18);color:var(--warn);}
.bdg[data-l="INFO"]{background:rgba(90,162,255,.18);color:var(--info);}
.bdg[data-l="DEBUG"]{background:var(--surface-2);color:var(--fg-faint);}
.row .ty{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:.6px;padding:2px 6px;border-radius:4px;
  min-width:58px;text-align:center;margin-top:1px;background:var(--surface-2);color:var(--fg-dim);}
.row .m{color:var(--fg);word-break:break-word;white-space:pre-wrap;flex:1;}
.row[data-l="ERROR"] .m{color:#ff9089;}
.row[data-l="WARN"] .m{color:#e2c281;}
.row[data-l="DEBUG"] .m{color:var(--fg-dim);}
html[data-theme="light"] .row[data-l="ERROR"] .m{color:#b02a23;}
html[data-theme="light"] .row[data-l="WARN"] .m{color:#8a6410;}
mark{background:var(--warn);color:#0a0e14;border-radius:2px;padding:0 2px;}

/* guide / states */
.state{padding:64px 24px;text-align:center;color:var(--fg-dim);}
.steps{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
.step{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  padding:13px 19px;border-radius:var(--r);font-size:12.5px;font-weight:600;color:var(--fg-faint);
  transition:border-color .25s var(--ease),color .25s var(--ease);}
.step .n{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--fg-faint);font-size:11px;font-weight:800;transition:background .25s var(--ease);}
.step[data-s="active"]{border-color:var(--accent);color:var(--fg);box-shadow:0 0 0 4px var(--accent-weak);}
.step[data-s="active"] .n{background:var(--accent);color:#fff;}
.step[data-s="done"]{border-color:rgba(51,209,122,.40);color:var(--ok);}
.step[data-s="done"] .n{background:var(--ok);color:#fff;}
.hint{font-size:13px;line-height:1.75;max-width:460px;margin:0 auto;color:var(--fg-dim);}
.hint b{color:var(--fg);font-weight:600;}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* footer */
lt-footer .ft{padding:8px 22px;font-family:var(--mono);font-size:10px;letter-spacing:.5px;color:var(--fg-faint);
  background:var(--bg-1);border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;flex-shrink:0;}

@media(max-width:860px){
  .panel{gap:13px;}
  .grow{min-width:100%;}
  .stats{width:100%;border-left:none;padding-left:0;}
  .clock{display:none;}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important;}}
</style>
</head>
<body>
<lt-app></lt-app>

<script>
/* =====================================================================
   0 · CONFIG  (ports must match backend/config.js)
   ===================================================================== */
const SERVER_CONFIGS = [
  { id:'live',    label:'LIVE',    color:'#33d17a', wsPort:5050, httpPort:5051 },
  { id:'live-ae', label:'LIVE-AE', color:'#5dc9c0', wsPort:5054, httpPort:5055 },
  { id:'mock-ae', label:'MOCK',    color:'#e0a13d', wsPort:5052, httpPort:5053 },
  { id:'mock',    label:'MOCK-AE', color:'#e3b341', wsPort:5056, httpPort:5057 },
  { id:'pp',      label:'MOCK-PP', color:'#c98bff', wsPort:5058, httpPort:5059 },
];
const HOST     = location.hostname || 'localhost';
const RING_CAP = 6000;
const App = {};   // late-bound refs (App.viewer) — populated by <lt-app>
const LT_META  = {
  server:  { name:'Server',  tag:'SERVER'  },
  console: { name:'Console', tag:'CONSOLE' },
  gc:      { name:'GC',      tag:'GC'      },
  all:     { name:'All',     tag:'ALL'     },
};

/* =====================================================================
   1 · MOTION  — tiny self-contained GSAP-style tween engine
   ===================================================================== */
const Ease = {
  outCubic:  t => 1 - Math.pow(1 - t, 3),
  inOutCubic:t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2,
  outQuart:  t => 1 - Math.pow(1 - t, 4),
};
function tween({ duration=400, ease=Ease.outCubic, onUpdate, onComplete, delay=0 }){
  let start=null, raf=null;
  const step = now => {
    if(start===null) start=now;
    const e = (now - start - delay);
    if(e < 0){ raf=requestAnimationFrame(step); return; }
    const p = Math.min(1, e / duration);
    onUpdate(ease(p), p);
    if(p < 1) raf=requestAnimationFrame(step);
    else onComplete && onComplete();
  };
  raf=requestAnimationFrame(step);
  return () => cancelAnimationFrame(raf);
}
const Motion = {
  /* fade + rise; calm */
  enter(el, { y=10, duration=420, delay=0 }={}){
    if(!el) return;
    el.style.opacity='0'; el.style.transform=`translateY(${y}px)`;
    tween({ duration, delay, onUpdate:k=>{
      el.style.opacity=k;
      el.style.transform=`translateY(${(1-k)*y}px)`;
    }, onComplete:()=>{ el.style.opacity=''; el.style.transform=''; }});
  },
  stagger(els, opts={}){ [...els].forEach((el,i)=>Motion.enter(el,{...opts, delay:(opts.delay||0)+i*55})); },
  /* animate height 0<->auto for collapsible panels */
  collapse(el, open, { duration=300 }={}){
    if(!el) return;
    const from = el.getBoundingClientRect().height;
    if(open) el.hidden=false;                 // must be visible before measuring
    el.style.overflow='hidden';
    const target = open ? el.scrollHeight : 0;
    tween({ duration, ease:Ease.inOutCubic, onUpdate:k=>{
      el.style.height = (from + (target-from)*k) + 'px';
      el.style.opacity = open ? Math.min(1,k+.2) : (1-k);
    }, onComplete:()=>{
      el.style.height = open ? '' : '';
      el.style.overflow=''; el.style.opacity='';
      if(!open) el.hidden=true;
    }});
  },
  /* number count-up */
  count(el, to, { duration=340 }={}){
    if(!el) return;
    const from = parseInt(el.textContent.replace(/\D/g,''))||0;
    if(from===to){ el.textContent=to; return; }
    tween({ duration, onUpdate:k=> el.textContent = Math.round(from+(to-from)*k) });
  },
  /* move the sliding pill inside a .seg */
  pill(seg){
    const p = seg.querySelector('.pill');
    const on = seg.querySelector('[aria-selected="true"]');
    if(!p) return;
    if(!on){ p.style.opacity='0'; return; }
    const sr = seg.getBoundingClientRect(), br = on.getBoundingClientRect();
    const x = br.left - sr.left - 3, w = br.width;
    if(p.style.opacity==='0' || p.style.opacity===''){
      p.style.transform=`translateX(${x}px)`; p.style.width=w+'px'; p.style.opacity='1'; return;
    }
    const ct = getComputedStyle(p).transform;
    let fx = 0;
    try{ fx = (ct && ct!=='none') ? new DOMMatrixReadOnly(ct).m41 : 0; }catch(e){ fx = 0; }
    const fw = parseFloat(p.style.width)||w;
    tween({ duration:240, onUpdate:k=>{
      p.style.transform=`translateX(${fx+(x-fx)*k}px)`;
      p.style.width=(fw+(w-fw)*k)+'px';
    }});
  },
};

/* =====================================================================
   2 · STORE  — single source of truth + event bus
   ===================================================================== */
const Store = {
  s:{
    servers:{},                 // id -> { config, nodes:[], conn:'offline' }
    serverId:null, nodeId:null, logType:null,
    mode:'live',                // 'live' | 'history'
    streaming:false,
    autoScroll:true,
    filters:{ search:'', level:'ALL' },
    stats:{ total:0, shown:0, ERROR:0, WARN:0, INFO:0, DEBUG:0 },
    hist:{ date:'', start:'', end:'', truncated:false, fetched:0 },
    theme: (()=>{ try{ return localStorage.getItem('lt-theme')||'dark'; }catch(e){ return 'dark'; } })(),
  },
  _subs:new Set(),
  on(fn){ this._subs.add(fn); return ()=>this._subs.delete(fn); },
  emit(type, detail){ this._subs.forEach(fn=>fn(type, detail)); },

  node(){ return this.s.servers[this.s.serverId]?.nodes.find(n=>n.id===this.s.nodeId); },
  serverCfg(){ return SERVER_CONFIGS.find(c=>c.id===this.s.serverId); },
  ready(){ return this.s.serverId && this.s.nodeId && this.s.logType; },
};

/* =====================================================================
   3 · BUFFERS  — raw log storage, kept out of reactive store for perf
   ===================================================================== */
const Buffers = new Map();       // `${srv}|${node}|${lt}` -> [msg,...]
const bkey = (s,n,l)=> s+'|'+n+'|'+l;
function bpush(k,msg){
  let a = Buffers.get(k);
  if(!a){ a=[]; Buffers.set(k,a); }
  a.push(msg);
  if(a.length>RING_CAP) a.shift();
}
function bclearActive(){
  const {serverId,nodeId} = Store.s;
  const node = Store.node();
  (node?.logTypes||[]).forEach(lt=> Buffers.set(bkey(serverId,nodeId,lt.id), []));
}
function activeLogs(){
  const {serverId,nodeId,logType} = Store.s;
  if(!serverId||!nodeId||!logType) return [];
  const node = Store.node();
  if(logType==='all'){
    const out=[];
    (node?.logTypes||[]).forEach(lt=>{
      (Buffers.get(bkey(serverId,nodeId,lt.id))||[]).forEach(m=>out.push(m));
    });
    out.sort((a,b)=>(a.timestamp||'').localeCompare(b.timestamp||''));
    return out;
  }
  return (Buffers.get(bkey(serverId,nodeId,logType))||[]).slice();
}

/* =====================================================================
   4 · WEBSOCKET MANAGER
   ===================================================================== */
const Net = {
  conns:{},
  init(){
    SERVER_CONFIGS.forEach(sc=>{
      Store.s.servers[sc.id] = { config:sc, nodes:[], conn:'connecting' };
      this.connect(sc);
    });
  },
  connect(sc){
    let ws;
    try{ ws = new WebSocket(`ws://${HOST}:${sc.wsPort}`); }
    catch(e){ setTimeout(()=>this.connect(sc), 3000); return; }
    this.conns[sc.id] = ws;
    Store.s.servers[sc.id].conn = 'connecting'; Store.emit('conn', sc.id);

    ws.onopen = ()=>{ Store.s.servers[sc.id].conn='online'; Store.emit('conn', sc.id); this.subscribeActive(); };
    ws.onclose = ()=>{ Store.s.servers[sc.id].conn='offline'; Store.emit('conn', sc.id); setTimeout(()=>this.connect(sc),3000); };
    ws.onerror = ()=>{ Store.s.servers[sc.id].conn='offline'; Store.emit('conn', sc.id); };
    ws.onmessage = evt=>{
      let m; try{ m=JSON.parse(evt.data); }catch(e){ return; }
      if(m.type==='nodes'){
        const st=Store.s.servers[sc.id];
        if(!st.nodes.length){ st.nodes = m.nodes||[]; Store.emit('nodes', sc.id); }
      } else if(m.type==='log'){
        this.onLog(sc.id, m);
      }
    };
  },
  onLog(serverId, msg){
    const lt = msg.logType || 'server';
    bpush(bkey(serverId, msg.nodeId, lt), msg);
    const {serverId:as, nodeId:an, logType:al, mode, streaming} = Store.s;
    if(mode!=='live' || !streaming) return;
    if(serverId!==as || msg.nodeId!==an) return;
    if(al!=='all' && lt!==al) return;
    Store.emit('live-line', msg);
  },
  subscribeActive(){
    const {serverId,nodeId,logType,streaming,mode} = Store.s;
    const ws = this.conns[serverId];
    if(!ws || ws.readyState!==1) return;
    if(mode!=='live' || !streaming || !nodeId || !logType){
      ws.send(JSON.stringify({ type:'subscribe', nodeId:'__stopped__', logType:'' }));
      return;
    }
    const node = Store.s.servers[serverId]?.nodes.find(n=>n.id===nodeId);
    const ids = logType==='all' ? (node?.logTypes||[]).map(l=>l.id) : [logType];
    ids.forEach(id=> ws.send(JSON.stringify({ type:'subscribe', nodeId, logType:id })));
  },
  async fetchHistory(ltIds, q){
    const sc = Store.serverCfg();
    const base = `http://${HOST}:${sc.httpPort}`;
    const parts = await Promise.all(ltIds.map(async id=>{
      const p = new URLSearchParams({ start:q.start, end:q.end, nodeId:Store.s.nodeId, logType:id, lines:100000 });
      const r = await fetch(`${base}/api/logs?${p}`);
      const d = await r.json();
      if(!d.success) throw new Error(d.error || 'request failed');
      return { id, logs:d.logs||[], truncated:!!d.truncated };
    }));
    return parts;
  },
};

/* =====================================================================
   5 · HELPERS
   ===================================================================== */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl = (t,kw)=>{
  if(!kw) return t;
  try{ return t.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`); }
  catch(e){ return t; }
};
const lineTime = l => (l && (l.match(/\b(\d{2}:\d{2}:\d{2})/)||[])[1]) || '';
function norm(m){
  return {
    time: m.timestamp ? m.timestamp.slice(11,19) : lineTime(m.line),
    level: m.level || 'DEBUG',
    node: m.nodeName || m.nodeId || '',
    logType: m.logType || Store.s.logType || 'server',
    line: m.line || '',
  };
}
function matchFilter(o){
  const { search, level } = Store.s.filters;
  const kw = search.toLowerCase().trim();
  const L = o.level || 'DEBUG';
  let ok;
  switch(level){
    case 'ERROR': ok = L==='ERROR'; break;
    case 'WARN':  ok = L==='ERROR'||L==='WARN'; break;
    case 'INFO':  ok = L==='ERROR'||L==='WARN'||L==='INFO'; break;
    case 'DEBUG': ok = L==='DEBUG'; break;
    default: ok = true;
  }
  return ok && (!kw || (o.line||'').toLowerCase().includes(kw));
}
function recomputeStats(){
  const src = activeLogs().map(norm);
  const c = { total:src.length, shown:0, ERROR:0, WARN:0, INFO:0, DEBUG:0 };
  src.forEach(o=>{ if(c[o.level]!==undefined) c[o.level]++; if(matchFilter(o)) c.shown++; });
  Store.s.stats = c;
  Store.emit('stats');
}
function download(text, name, type){
  const url = URL.createObjectURL(new Blob([text],{type}));
  const a = document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 800);
}

customElements.define('lt-viewer', class extends Comp {
  template(){ return `
    <div class="scroll" data-scroll>
      <div class="state" data-guide>
        <div class="steps">
          <div class="step" data-step="1"><span class="n">1</span> Environment</div>
          <div class="step" data-step="2"><span class="n">2</span> Node</div>
          <div class="step" data-step="3"><span class="n">3</span> Log type</div>
          <div class="step" data-step="4"><span class="n">▶</span> Start / Search</div>
        </div>
        <p class="hint">
          Pick an <b>environment</b>, then the <b>node</b> to inspect
          (LIVE exposes all 4 nodes), then a <b>log type</b> — Server, Console or GC.
          Use <b>Live</b> to stream now or <b>History</b> to pull a past window, then export as a spreadsheet.
        </p>
      </div>
      <div class="state" data-loading hidden><div class="spin"></div>Fetching logs…</div>
      <div class="list" data-list></div>
    </div>`; }

  mounted(){
    this.scrollEl=this.$('[data-scroll]');
    this.listEl=this.$('[data-list]');
    this.guideEl=this.$('[data-guide]');
    this.loadEl=this.$('[data-loading]');
    this.rendered=[];               // full filtered set (for export)
    this._scrollQ=false; this._statsQ=false; this._batch=0;
    this.syncGuide();
    Motion.enter(this.scrollEl, { y:6, duration:460, delay:160 });
  }

  /* ---- state helpers ---- */
  syncGuide(){
    const done={1:!!Store.s.serverId,2:!!Store.s.nodeId,3:!!Store.s.logType};
    for(const i of [1,2,3]){
      const s = done[i] ? 'done' : (this.activeStep()===i ? 'active' : '');
      this.$(`[data-step="${i}"]`).dataset.s = s;
    }
    this.$('[data-step="4"]').dataset.s = (done[1]&&done[2]&&done[3]) ? 'active' : '';
    const incomplete = !(Store.ready());
    this.guideEl.hidden = !(incomplete && this.listEl.children.length===0 && !this.rendered.length);
  }
  activeStep(){
    if(!Store.s.serverId) return 1;
    if(!Store.s.nodeId) return 2;
    if(!Store.s.logType) return 3;
    return 4;
  }
  placeholder(html){
    this.listEl.innerHTML = `<div class="state" style="padding:52px 22px">${html}</div>`;
  }

  /* ---- live stream ---- */
  startStream(){
    if(!Store.ready()) return;
    Store.s.mode='live'; Store.s.streaming=true;
    bclearActive();
    this.rendered=[]; this.listEl.innerHTML='';
    this.guideEl.hidden=true;
    Net.subscribeActive();
    Store.emit('selection'); recomputeStats();
  }
  stopStream(){
    Store.s.streaming=false;
    Net.subscribeActive();
    Store.emit('selection');
  }
  pushLive(msg){
    const o=norm(msg);
    if(matchFilter(o)){
      this.rendered.push(o);
      if(this.rendered.length>RING_CAP) this.rendered.shift();
      const row=this.buildRow(o);
      const bulk = (++this._batch) > 6;
      this.listEl.appendChild(row);
      if(this.listEl.children.length>RING_CAP) this.listEl.removeChild(this.listEl.firstChild);
      if(!bulk) Motion.enter(row, { y:4, duration:170 });
      this.queueScroll();
    }
    this.queueStats();
  }

  /* ---- history ---- */
  async runHistory(q, setStatus){
    if(!Store.s.serverId) return setStatus({text:'Select an environment.', kind:'err'});
    if(!Store.s.nodeId)   return setStatus({text:'Select a node.', kind:'err'});
    if(!Store.s.logType)  return setStatus({text:'Select a log type.', kind:'err'});
    if(!q.start||!q.end)  return setStatus({text:'Set both From and To times.', kind:'err'});

    Store.s.mode='history'; Store.s.streaming=false;
    const node=Store.node();
    const ltIds = Store.s.logType==='all' ? (node?.logTypes||[]).map(l=>l.id) : [Store.s.logType];
    setStatus({text:'Loading…', kind:''});
    this.guideEl.hidden=true; this.listEl.innerHTML=''; this.loadEl.hidden=false;
    this.rendered=[];

    try{
      const parts = await Net.fetchHistory(ltIds, q);
      this.loadEl.hidden=true;
      let all=[], trunc=false;
      parts.forEach(p=>{
        p.logs.forEach(e=> all.push({ time:lineTime(e.line), level:e.level||'DEBUG',
          node:node?.name||Store.s.nodeId, logType:p.id, line:e.line||'' }));
        if(p.truncated) trunc=true;
      });
      all.sort((a,b)=>(a.time||'').localeCompare(b.time||''));

      if(q.date){
        const dated = all.filter(x=>/\d{4}-\d{2}-\d{2}/.test(x.line));
        if(dated.length) all = all.filter(x=>{
          const m=x.line.match(/(\d{4}-\d{2}-\d{2})/); return !m || m[1]===q.date;
        });
      }

      Store.s.hist = { ...q, truncated:trunc, fetched:all.length };
      this.rendered = all;
      this.renderAll();
      const shown = all.filter(matchFilter).length;
      setStatus({ text:`${all.length} fetched · ${shown} shown${trunc?' · ⚠ truncated (volume cap)':''}`,
                  kind: trunc?'err':'ok' });
      Store.emit('history');
    }catch(err){
      this.loadEl.hidden=true;
      setStatus({ text:'API error: '+err.message, kind:'err' });
      this.placeholder(`<span style="color:var(--err)">Could not reach ${Store.serverCfg()?.label} API `+
        `on port ${Store.serverCfg()?.httpPort}.</span><br><span style="color:var(--fg-dim)">${esc(err.message)}</span>`);
    }
  }

  /* ---- filtering / rendering ---- */
  applyFilters(){
    if(Store.s.mode==='history'){ this.renderAll(); return; }
    // live: rebuild from buffer
    this.rendered = activeLogs().map(norm).filter(matchFilter);
    this.renderAll();
  }
  renderAll(){
    const kw = Store.s.filters.search.toLowerCase().trim();
    const showType = Store.s.logType==='all';
    const frag=document.createDocumentFragment();
    let shown=0;
    const src = this.rendered;
    for(const o of src){
      if(!matchFilter(o)) continue;
      frag.appendChild(this.buildRow(o, kw, showType));
      shown++;
    }
    this.listEl.innerHTML='';
    if(!shown){
      this.placeholder(src.length ? 'No lines match the current filters.' : 'No logs for this selection.');
    }else{
      this.listEl.appendChild(frag);
      Motion.enter(this.listEl, { y:4, duration:200 });
    }
    recomputeStats();
    if(Store.s.autoScroll && Store.s.mode==='live') this.toBottom();
    else this.scrollEl.scrollTop = 0;
  }
  buildRow(o, kw=Store.s.filters.search.toLowerCase().trim(), showType=Store.s.logType==='all'){
    const L=o.level||'DEBUG';
    const row=document.createElement('div');
    row.className='row'; row.dataset.l=L;
    let h = `<span class="t">${o.time||''}</span><span class="bdg" data-l="${L}">${L}</span>`;
    if(showType) h += `<span class="ty">${LT_META[o.logType]?.tag || String(o.logType||'').toUpperCase()}</span>`;
    h += `<span class="m">${hl(esc(o.line||''), kw)}</span>`;
    row.innerHTML=h;
    return row;
  }

  /* ---- export ---- */
  exportAs(fmt){
    const logs = this.rendered.filter(matchFilter);
    if(!logs.length){ alert('Nothing to export — no visible lines.'); return; }
    const sc=Store.serverCfg(), node=Store.node();
    const meta={
      server:sc?.label||'', node:node?.name||'', logType:LT_META[Store.s.logType]?.name||Store.s.logType||'',
      mode:Store.s.mode, ...Store.s.hist,
      level:Store.s.filters.level, keyword:Store.s.filters.search.trim(),
    };
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    const base=[meta.server, meta.node, Store.s.logType,
      (meta.date||d.toISOString().slice(0,10)).replace(/-/g,''),
      p(d.getHours())+p(d.getMinutes())].filter(Boolean).join('_').replace(/\s+/g,'');
    try{
      if(fmt==='xls')      download(this.xls(logs,meta), base+'.xls', 'application/vnd.ms-excel;charset=utf-8');
      else if(fmt==='csv') download(this.csv(logs,meta), base+'.csv', 'text/csv;charset=utf-8');
      else                 download(this.txt(logs,meta), base+'.txt', 'text/plain;charset=utf-8');
    }catch(err){ alert('Export failed: '+err.message); }
  }
  _fields(o,meta){
    return [o.time||'', o.level||'', o.node||meta.node||'',
      LT_META[o.logType]?.name||o.logType||meta.logType||'', o.line||''];
  }
  csv(logs,meta){
    const cell=v=>{ v=String(v==null?'':v).replace(/\r?\n/g,' ');
      return /[",;\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const head=['Timestamp','Level','Node','LogType','Message'];
    const rows=[head.join(','), ...logs.map(o=>this._fields(o,meta).map(cell).join(','))];
    return '﻿sep=,\r\n'+rows.join('\r\n')+'\r\n';
  }
  xls(logs,meta){
    const e=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const cols=['Timestamp','Level','Node','LogType','Message'];
    const head='<tr>'+cols.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
    const body=logs.map(o=>{
      const f=this._fields(o,meta);
      return '<tr><td>'+e(f[0])+'</td><td class="lvl '+e(f[1])+'">'+e(f[1])+'</td><td>'+e(f[2])+
        '</td><td>'+e(f[3])+'</td><td>'+e(f[4])+'</td></tr>';
    }).join('');
    const title=`Amrita Log Tracker — ${meta.mode==='history'?'History':'Live'} · ${meta.server} / ${meta.node} / ${meta.logType}`;
    return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">'+
      '<head><meta charset="utf-8"/>'+
      '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'+
      '<x:Name>Logs</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>'+
      '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'+
      '<style>table{border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11pt}'+
      'caption{font-weight:bold;text-align:left;padding:6px 4px;font-size:12pt}'+
      'th{background:#1f3864;color:#fff;text-align:left;border:1px solid #7f8fb0;padding:4px 9px}'+
      'td{border:1px solid #ccc;padding:3px 9px;vertical-align:top;mso-number-format:"\\@"}'+
      'td.lvl{font-weight:bold;text-align:center}.ERROR{color:#c00000}.WARN{color:#bf8f00}'+
      '.INFO{color:#2f6fe0}.DEBUG{color:#808080}</style></head>'+
      '<body><table><caption>'+e(title)+' — '+logs.length+' lines, exported '+new Date().toLocaleString()+
      '</caption>'+head+body+'</table></body></html>';
  }
  txt(logs,meta){
    const c={ERROR:0,WARN:0,INFO:0,DEBUG:0}; logs.forEach(o=>{ if(c[o.level]!==undefined) c[o.level]++; });
    const bar='='.repeat(74);
    let t=bar+`\n  Amrita Log Tracker — ${meta.mode==='history'?'History':'Live'} Export\n`+bar+'\n';
    t+=`  Environment : ${meta.server}\n  Node        : ${meta.node}\n  Log type    : ${meta.logType}\n`;
    t+=`  Exported    : ${new Date().toLocaleString()}\n  Lines       : ${logs.length}\n`;
    if(meta.mode==='history') t+=`  Window      : ${meta.date} ${meta.start} → ${meta.end}\n`;
    if(meta.level&&meta.level!=='ALL') t+=`  Level       : ${meta.level}\n`;
    if(meta.keyword) t+=`  Keyword     : ${meta.keyword}\n`;
    if(meta.truncated) t+=`  NOTE        : window TRUNCATED — volume exceeded buffer\n`;
    t+=bar+`\n  ERROR ${c.ERROR}   WARN ${c.WARN}   INFO ${c.INFO}   DEBUG ${c.DEBUG}\n`+'-'.repeat(74)+'\n\n';
    logs.forEach(o=>{ t+=`[${(o.level||'').padEnd(5)}] ${o.time?'['+o.time+'] ':''}${o.line||''}\n`; });
    t+='\n'+bar+`\n  End — ${logs.length} lines\n`+bar+'\n';
    return t;
  }

  /* ---- misc ---- */
  clear(){
    if(Store.s.mode==='history'){
      this.rendered=[]; Store.s.hist={date:'',start:'',end:'',truncated:false,fetched:0};
      Store.s.mode='live'; Store.emit('selection');
      this.listEl.innerHTML=''; this.syncGuide(); return;
    }
    bclearActive(); this.rendered=[];
    this.placeholder('Cleared.'); recomputeStats();
  }
  toBottom(){
    if(this._scrollQ) return; this._scrollQ=true;
    requestAnimationFrame(()=>{ this.scrollEl.scrollTop=this.scrollEl.scrollHeight; this._scrollQ=false; });
  }
  queueScroll(){ if(Store.s.autoScroll) this.toBottom(); }
  queueStats(){
    if(this._statsQ) return; this._statsQ=true;
    setTimeout(()=>{ this._statsQ=false; this._batch=0; recomputeStats(); }, 220);
  }

  onStore(type, detail){
    if(type==='selection'){
      this.syncGuide();
      if(Store.s.mode==='live' && Store.ready() && !Store.s.streaming && this.listEl.children.length===0){
        this.placeholder(`Ready — press <b style="color:var(--ok)">▶ Start</b> to stream `+
          `<b>${LT_META[Store.s.logType]?.name||Store.s.logType}</b> logs.`);
      }
      recomputeStats();
    }
    if(type==='filters') this.applyFilters();
    if(type==='live-line') this.pushLive(detail);
  }
});

/* =====================================================================
   13 · <lt-footer>
   ===================================================================== */
customElements.define('lt-footer', class extends Comp {
  template(){ return `<div class="ft"><span>AMRITA TECH · Log Tracker v3</span><span data-r>idle</span></div>`; }
  mounted(){ this.render(); }
  render(){
    const r=this.$('[data-r]');
    if(Store.s.mode==='history') r.textContent = `history · ${Store.s.hist.fetched||0} lines`;
    else r.textContent = Store.s.streaming ? 'streaming' : (Store.ready()?'ready':'idle');
  }
  onStore(type){ if(type==='selection'||type==='history'||type==='stats') this.render(); }
});

/* =====================================================================
   14 · <lt-app>  — root
   ===================================================================== */
customElements.define('lt-app', class extends Comp {
  template(){ return `
    <lt-header></lt-header>
    <lt-source></lt-source>
    <lt-timerange></lt-timerange>
    <lt-toolbar></lt-toolbar>
    <lt-strip></lt-strip>
    <lt-viewer></lt-viewer>
    <lt-footer></lt-footer>`; }
  mounted(){
    App.viewer = this.querySelector('lt-viewer');
    Net.init();
  }
});
</script>
